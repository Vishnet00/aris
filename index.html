<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A.R.I.S. — Advanced Responsive Intelligence System</title>
<style>
  :root {
    --cyan: #00e5ff;
    --cyan-dim: #00b8d4;
    --blue: #2979ff;
    --bg: #0a0a0f;
    --surface: #12121f;
    --surface2: #1a1a2e;
    --text: #e0e0e0;
    --text-dim: #8899aa;
    --danger: #ff5252;
    --gold: #ffd740;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Courier New', 'SF Mono', 'Fira Code', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Background particles */
  .particles {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: var(--cyan);
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    10% { opacity: 0.8; }
    90% { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-10vh) scale(2); }
  }

  /* Sparkles ✨ */
  .sparkle {
    position: absolute; pointer-events: none; z-index: 2;
    width: 4px; height: 4px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px var(--cyan), 0 0 12px var(--cyan-dim);
    animation: sparkleFloat 1.5s ease-out forwards;
    opacity: 0;
  }
  @keyframes sparkleFloat {
    0% { opacity: 0; transform: translate(0,0) scale(0); }
    20% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.3); }
  }
  .sparkle.gold {
    box-shadow: 0 0 6px 2px var(--gold), 0 0 12px rgba(255,215,64,0.5);
    background: #fffbe6;
  }
  .sparkle.blue {
    box-shadow: 0 0 6px 2px var(--blue), 0 0 12px rgba(41,121,255,0.5);
    background: #e8f0ff;
  }

  /* Grid lines */
  .grid {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 30%, transparent 70%);
  }

  /* Main container */
  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 520px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 8px) 12px env(safe-area-inset-bottom, 12px);
  }

  /* Header */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(0,229,255,0.15);
    margin-bottom: 8px;
  }
  .header-logo {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--cyan), var(--blue));
    box-shadow: 0 0 20px rgba(0,229,255,0.3), 0 0 60px rgba(0,229,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    animation: logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%,100% { box-shadow: 0 0 20px rgba(0,229,255,0.3), 0 0 60px rgba(0,229,255,0.1); }
    50% { box-shadow: 0 0 30px rgba(0,229,255,0.5), 0 0 80px rgba(0,229,255,0.2); }
  }
  .header-info { flex: 1; }
  .header-title {
    font-size: 14px; font-weight: 700;
    letter-spacing: 2px;
    color: var(--cyan);
    text-transform: uppercase;
  }
  .header-subtitle {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 1px;
  }
  .header-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: #4caf50;
    letter-spacing: 1px;
  }
  .status-dot {
    width: 6px; height: 6px;
    background: #4caf50;
    border-radius: 50%;
    box-shadow: 0 0 8px #4caf50;
    animation: statusBlink 2s ease-in-out infinite;
  }
  @keyframes statusBlink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Orb */
  .orb-container {
    display: flex; align-items: center; justify-content: center;
    padding: 16px 0; position: relative;
    min-height: 100px;
  }
  .orb-sparkles {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 120px; height: 120px; pointer-events: none; z-index: 3;
  }
  .orb-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid rgba(0,229,255,0.2);
    position: relative;
    animation: orbSpin 8s linear infinite;
  }
  .orb-ring::before {
    content: '';
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 1px solid rgba(0,229,255,0.1);
    animation: orbSpin 12s linear infinite reverse;
  }
  .orb-core {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, white, var(--cyan));
    box-shadow: 0 0 30px var(--cyan), 0 0 60px var(--cyan-dim);
  }
  @keyframes orbSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Orb states */
  .orb-container.idle .orb-core {
    box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan-dim);
    animation: idleGlow 2s ease-in-out infinite;
  }
  @keyframes idleGlow {
    0%,100% { box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan-dim); }
    50% { box-shadow: 0 0 35px var(--cyan), 0 0 60px var(--cyan-dim); }
  }
  .orb-container.thinking .orb-core {
    animation: thinkingPulse 0.6s ease-in-out infinite;
    box-shadow: 0 0 40px var(--blue), 0 0 80px var(--cyan);
  }
  @keyframes thinkingPulse {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-50%,-50%) scale(1.4); }
  }
  .orb-container.thinking .orb-ring {
    border-color: rgba(41,121,255,0.5);
    animation: orbSpin 3s linear infinite;
  }
  .orb-container.error .orb-core {
    background: radial-gradient(circle at 40% 40%, white, var(--danger));
    box-shadow: 0 0 30px var(--danger), 0 0 60px rgba(255,82,82,0.5);
  }
  .orb-container.streaming .orb-core {
    animation: streamPulse 1s ease-in-out infinite;
    box-shadow: 0 0 35px var(--cyan), 0 0 70px var(--cyan-dim);
  }
  @keyframes streamPulse {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-50%,-50%) scale(1.15); }
  }

  /* Waveform bars */
  .waveform {
    display: flex; align-items: flex-end; gap: 3px;
    height: 30px; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    opacity: 0; transition: opacity 0.3s;
  }
  .orb-container.thinking .waveform,
  .orb-container.streaming .waveform { opacity: 1; }
  .wave-bar {
    width: 3px; background: var(--cyan);
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite;
  }
  .wave-bar:nth-child(odd) { animation-delay: 0.1s; }
  .wave-bar:nth-child(2n) { animation-delay: 0.3s; }
  .wave-bar:nth-child(3n) { animation-delay: 0.5s; }
  @keyframes wave {
    0%,100% { height: 4px; opacity: 0.3; }
    50% { height: 28px; opacity: 1; }
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 4px 4px 12px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.15); border-radius: 4px; }

  /* Messages */
  .msg {
    display: flex; gap: 8px;
    animation: msgIn 0.3s ease-out;
    max-width: 100%;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .msg.arris .msg-avatar {
    background: radial-gradient(circle at 40% 40%, var(--cyan), var(--blue));
    box-shadow: 0 0 12px rgba(0,229,255,0.3);
    font-size: 16px;
  }
  .msg.user .msg-avatar {
    background: var(--surface2);
    border: 1px solid rgba(255,215,64,0.3);
    font-size: 16px;
  }
  .msg-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.55;
    max-width: 80%;
    word-wrap: break-word;
  }
  .msg.arris .msg-bubble {
    background: var(--surface);
    border: 1px solid rgba(0,229,255,0.15);
    border-top-left-radius: 4px;
    color: var(--text);
  }
  .msg.user .msg-bubble {
    background: rgba(41,121,255,0.15);
    border: 1px solid rgba(41,121,255,0.2);
    border-top-right-radius: 4px;
    color: var(--text);
  }
  .msg-time {
    font-size: 9px; color: var(--text-dim);
    margin-top: 4px; text-align: right;
  }

  /* Cursor blink in streaming text */
  .streaming-cursor {
    display: inline-block;
    width: 7px; height: 14px;
    background: var(--cyan);
    margin-left: 1px;
    vertical-align: middle;
    animation: cursorBlink 0.6s step-end infinite;
  }
  @keyframes cursorBlink {
    0%,100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Typing indicator */
  .typing-indicator {
    display: none; align-items: center; gap: 10px;
    padding: 0 8px;
  }
  .typing-indicator.active { display: flex; }
  .typing-dots {
    display: flex; gap: 4px;
  }
  .typing-dot {
    width: 6px; height: 6px;
    background: var(--cyan-dim);
    border-radius: 50%;
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%,60%,100% { opacity: 0.2; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-8px); }
  }

  /* Input area */
  .input-area {
    display: flex; gap: 8px;
    padding: 8px 4px;
    border-top: 1px solid rgba(0,229,255,0.1);
    align-items: center;
  }
  .input-wrapper {
    flex: 1; position: relative;
  }
  .chat-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .chat-input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 15px rgba(0,229,255,0.15);
  }
  .chat-input::placeholder { color: var(--text-dim); opacity: 0.5; }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(0,229,255,0.3);
    background: var(--surface);
    color: var(--cyan);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: rgba(0,229,255,0.1); border-color: var(--cyan); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Welcome message */
  .welcome {
    text-align: center;
    padding: 20px;
    opacity: 0.7;
  }
  .welcome-icon {
    font-size: 48px; margin-bottom: 8px;
    animation: welcomeFloat 3s ease-in-out infinite;
  }
  @keyframes welcomeFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .welcome-title {
    font-size: 16px; color: var(--cyan);
    font-weight: 700; letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .welcome-sub {
    font-size: 11px; color: var(--text-dim);
    line-height: 1.6;
  }

  /* Suggestions */
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; padding: 4px 8px;
  }
  .suggestion-chip {
    padding: 6px 14px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid rgba(0,229,255,0.15);
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .suggestion-chip:hover, .suggestion-chip:active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(0,229,255,0.05);
  }

  /* Glitch effect on errors */
  .glitch {
    animation: glitch 0.3s ease;
  }
  @keyframes glitch {
    0%,100% { transform: translate(0); }
    20% { transform: translate(-3px, 2px); }
    40% { transform: translate(3px, -1px); }
    60% { transform: translate(-2px, -2px); }
    80% { transform: translate(2px, 1px); }
  }

  /* Responsive */
  @media (max-width: 400px) {
    .container { padding: 4px 6px; }
    .msg-bubble { max-width: 85%; font-size: 12px; }
    .header-title { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<div class="grid"></div>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-logo">◆</div>
    <div class="header-info">
      <div class="header-title">A.R.I.S.</div>
      <div class="header-subtitle">Advanced Responsive Intelligence System</div>
    </div>
    <div class="header-status">
      <div class="status-dot"></div>
      ONLINE
    </div>
  </div>

  <!-- Orb -->
  <div class="orb-container idle" id="orb">
    <div class="orb-sparkles" id="orbSparkles"></div>
    <div class="orb-ring">
      <div class="orb-core"></div>
    </div>
    <div class="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">◆</div>
      <div class="welcome-title">A.R.I.S. Online</div>
      <div class="welcome-sub">Good evening, sir. All systems nominal.<br>How may I assist you?</div>
    </div>
    <div class="suggestions" id="suggestions">
      <button class="suggestion-chip">What can you do?</button>
      <button class="suggestion-chip">Analyze my last mission</button>
      <button class="suggestion-chip">Tell me a joke</button>
      <button class="suggestion-chip">System diagnostics</button>
    </div>
    <div class="typing-indicator" id="typing">
      <div class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
      <span style="font-size:10px;color:var(--text-dim)">A.R.I.S. is thinking...</span>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" class="chat-input" id="chatInput"
             placeholder="Message A.R.I.S..."
             autocomplete="off" maxlength="500">
    </div>
    <button class="send-btn" id="sendBtn" disabled>↑</button>
  </div>
</div>

<script>
(function(){
  const chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');
  const orb = document.getElementById('orb');
  const orbSparkles = document.getElementById('orbSparkles');
  const welcome = document.getElementById('welcome');
  const suggestions = document.getElementById('suggestions');

  let messageHistory = [];
  let isProcessing = false;
  let streamAborter = null; // AbortController for cancelling current stream
  const API_URL = '/chat';

  // ── Sparkles ──────────────────────────────────────────────────

  function spawnSparkle(x, y, color) {
    const s = document.createElement('div');
    s.className = 'sparkle' + (color ? ' ' + color : '');
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 50;
    s.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--sy', Math.sin(angle) * dist - 15 + 'px');
    orbSparkles.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  }

  function sparkleBurst(count) {
    const rect = orbSparkles.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const colors = [null, null, 'gold', 'blue', null];
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const x = cx + (Math.random() - 0.5) * 40;
        const y = cy + (Math.random() - 0.5) * 40;
        spawnSparkle(x, y, colors[Math.floor(Math.random() * colors.length)]);
      }, i * 40);
    }
  }

  // Ambient sparkles around orb
  function ambientSparkle() {
    if (!isProcessing) {
      const rect = orbSparkles.getBoundingClientRect();
      const x = rect.width * 0.2 + Math.random() * rect.width * 0.6;
      const y = rect.height * 0.2 + Math.random() * rect.height * 0.6;
      spawnSparkle(x, y);
    }
    setTimeout(ambientSparkle, 1500 + Math.random() * 3000);
  }
  setTimeout(ambientSparkle, 2000);

  // ── Background particles ──────────────────────────────────────

  const particlesEl = document.getElementById('particles');
  for(let i=0;i<40;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (8+Math.random()*20)+'s';
    p.style.animationDelay = Math.random()*15+'s';
    p.style.width = (1+Math.random()*2)+'px';
    p.style.height = p.style.width;
    if(Math.random()>0.7) p.style.background = 'var(--blue)';
    particlesEl.appendChild(p);
  }

  // ── Helpers ────────────────────────────────────────────────────

  function getTime() {
    return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function scrollDown() {
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
  }

  function setOrbState(state) {
    orb.className = 'orb-container ' + state;
  }

  // ── Streaming typewriter ───────────────────────────────────────

  function createBubbleBlock() {
    welcome.style.display = 'none';
    suggestions.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = 'msg arris';
    msg.innerHTML = `
      <div class="msg-avatar">◆</div>
      <div>
        <div class="msg-bubble"><span class="msg-content"></span><span class="streaming-cursor"></span></div>
        <div class="msg-time">${getTime()}</div>
      </div>
    `;
    chatArea.insertBefore(msg, typing);
    scrollDown();
    return {
      el: msg,
      contentEl: msg.querySelector('.msg-content'),
      cursorEl: msg.querySelector('.streaming-cursor'),
      timeEl: msg.querySelector('.msg-time'),
      fullText: ''
    };
  }

  function finalizeBlock(block) {
    block.cursorEl.remove();
    block.timeEl.textContent = getTime();
  }

  async function streamBlocks(fullText, speed) {
    if (streamAborter) streamAborter.abort();
    const aborter = new AbortController();
    streamAborter = aborter;
    const signal = aborter.signal;

    // Split into sentences
    const sentences = fullText.match(/[^.!?\n]+[.!?\n]?/g) || [fullText];
    
    // Group into small blocks (1-2 sentences, max ~150 chars)
    const blocks = [];
    let current = '';
    for (const s of sentences) {
      const trimmed = s.trim();
      if (!trimmed) continue;
      if (current && (current.length + trimmed.length > 150 || 
          (current.match(/[.!?]/g)||[]).length >= 2)) {
        blocks.push(current.trim());
        current = trimmed;
      } else {
        current += ' ' + trimmed;
      }
    }
    if (current.trim()) blocks.push(current.trim());

    // If only one block, just stream it
    if (blocks.length <= 1) {
      const block = createBubbleBlock();
      await streamWords(block, blocks[0] || fullText, speed, signal);
      finalizeBlock(block);
      streamAborter = null;
      return;
    }

    // Stream each block as its own bubble
    for (let i = 0; i < blocks.length; i++) {
      if (signal.aborted) return;
      const block = createBubbleBlock();
      await streamWords(block, blocks[i], speed, signal);
      finalizeBlock(block);
      // Small pause between blocks — feels like natural pacing
      if (i < blocks.length - 1) {
        await new Promise(r => setTimeout(r, 400));
      }
    }
    streamAborter = null;
  }

  async function streamWords(block, text, speed, signal) {
    const words = text.split(/(\s+)/);
    let display = '';
    for (const word of words) {
      if (signal.aborted) return;
      display += word;
      block.contentEl.innerHTML = escapeHtml(display);
      block.fullText = display;
      scrollDown();
      await new Promise(r => setTimeout(r, speed));
    }
  }

  // ── Message handling ───────────────────────────────────────────

  function addMessage(role, text) {
    welcome.style.display = 'none';
    suggestions.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = 'msg '+role;
    msg.innerHTML = `
      <div class="msg-avatar">${role==='arris'?'◆':'🦸'}</div>
      <div>
        <div class="msg-bubble">${escapeHtml(text)}</div>
        <div class="msg-time">${getTime()}</div>
      </div>
    `;
    chatArea.insertBefore(msg, typing);
    scrollDown();
    return msg;
  }

  function setProcessing(state) {
    isProcessing = state;
    if (state) {
      typing.classList.add('active');
      setOrbState('thinking');
      sendBtn.disabled = true;
      chatInput.disabled = true;
    }
    scrollDown();
  }

  function finishProcessing() {
    typing.classList.remove('active');
    setOrbState('idle');
    sendBtn.disabled = false;
    chatInput.disabled = false;
    chatInput.focus();
    scrollDown();
  }

  // ── Send message ───────────────────────────────────────────────

  async function sendMessage(text) {
    if (isProcessing || !text.trim()) return;
    const msg = text.trim();

    // Cancel any ongoing stream
    if (streamAborter) { streamAborter.abort(); streamAborter = null; }

    // Add user message
    messageHistory.push({role:'user', content:msg});
    addMessage('user', msg);
    chatInput.value = '';
    setProcessing(true);

    // Sparkle burst on user send
    sparkleBurst(6);

    try {
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({message:msg, history:messageHistory})
      });

      if (!resp.ok) throw new Error('Server error: '+resp.status);

      const data = await resp.json();
      const reply = data.response || 'I seem to be experiencing some interference, sir.';

      messageHistory.push({role:'assistant', content:reply});

      // Start streaming — big sparkle burst
      setOrbState('streaming');
      typing.classList.remove('active');
      sparkleBurst(15);

      await streamBlocks(reply, 16);

      // Glitch on errors
      const lastBlock = chatArea.querySelector('.msg.arris:last-of-type');
      if (reply.toLowerCase().includes('error')||reply.toLowerCase().includes('interference')){
        if (lastBlock) lastBlock.classList.add('glitch');
        setOrbState('error');
        setTimeout(()=>setOrbState('idle'),2000);
      }

    } catch(err) {
      const fallback = 'Neural link disrupted, sir. Attempting to re-establish connection...';
      messageHistory.push({role:'assistant', content:fallback});
      const msgEl = addMessage('arris', fallback);
      msgEl.classList.add('glitch');
      setOrbState('error');
      setTimeout(()=>setOrbState('idle'),2000);
    }

    finishProcessing();
  }

  // ── Event listeners ────────────────────────────────────────────

  sendBtn.addEventListener('click',()=>sendMessage(chatInput.value));

  chatInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      sendMessage(chatInput.value);
    }
  });

  chatInput.addEventListener('input',()=>{
    sendBtn.disabled = !chatInput.value.trim() || isProcessing;
  });

  document.getElementById('suggestions').addEventListener('click',e=>{
    if(e.target.classList.contains('suggestion-chip')){
      sendMessage(e.target.textContent);
    }
  });

  setTimeout(()=>chatInput.focus(),500);
  document.addEventListener('touchstart',()=>{}, {passive:true});
})();
</script>
</body>
</html>
